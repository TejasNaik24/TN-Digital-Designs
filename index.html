<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04060C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- %TOKENS% are filled by the seo() plugin in vite.config.ts: %SITE_URL%
         from VITE_SITE_URL, the page fields from src/data/pageMeta.ts. The
         build writes one copy of this file per route with that route's values. -->
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%PAGE_DESCRIPTION%" />
    <link rel="canonical" href="%PAGE_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%PAGE_URL%" />
    <meta property="og:site_name" content="Tejas Naik — Digital Studio" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%PAGE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tejas Naik, Digital Studio. Websites for local businesses." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PAGE_TITLE%" />
    <meta name="twitter:description" content="%PAGE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="Tejas Naik, Digital Studio. Websites for local businesses." />

    <!-- Paint the page background before React mounts so there is no white flash. -->
    <style>
      html { background-color: #04060c; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
