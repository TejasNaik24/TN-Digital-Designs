<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Apple touch icon source</title>
    <!-- Source for public/apple-touch-icon.png: screenshot at a 180×180
         viewport (DPR 1). iOS ignores SVG touch icons, hence a PNG. -->
    <style>
      html, body { margin: 0; width: 180px; height: 180px; background: #070b14; }
      img { display: block; width: 180px; height: 180px; }
    </style>
  </head>
  <body>
    <img src="/favicon.svg" alt="" />
  </body>
</html>
